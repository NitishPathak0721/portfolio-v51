<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Photo.jpg" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
  </noscript>

  <!-- =========================
       SEO
  ========================== -->

  <title>Nitish Pathak | Front-End Web Developer</title>

  <meta
    name="description"
    content="Official portfolio of Nitish Pathak, a Front-End Web Developer focused on creating modern, engaging and user-friendly digital experiences."
  />

  <meta
    name="keywords"
    content="Nitish Pathak, Nitish, Front-End Web Developer, Web Developer, Portfolio, GitHub, LeetCode, Codolio"
  />

  <meta
    name="author"
    content="Nitish Pathak"
  />

  <!-- =========================
       Theme / PWA
  ========================== -->

  <meta name="theme-color" content="#030014" />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <!-- =========================
       Open Graph
  ========================== -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Nitish Pathak | Front-End Web Developer"
  />

  <meta
    property="og:description"
    content="Portfolio of Nitish Pathak, Front-End Web Developer."
  />

  <!-- =========================
       Twitter
  ========================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Nitish Pathak | Front-End Web Developer"
  />

  <meta
    name="twitter:description"
    content="Portfolio of Nitish Pathak, Front-End Web Developer."
  />

  <!-- =========================
       Structured Data
  ========================== -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Nitish Pathak",
    "jobTitle": "Front-End Web Developer",
    "description": "Front-End Web Developer focused on creating modern, engaging and user-friendly digital experiences.",
